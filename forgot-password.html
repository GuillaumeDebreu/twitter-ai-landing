<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublie - Reply AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <span class="brand-icon">✨</span>
            <span class="brand-text">Reply AI</span>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <h1>Mot de passe oublie ?</h1>
                <p>Entre ton email pour recevoir un lien de reinitialisation</p>
            </div>

            <form class="auth-form" id="forgotForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="ton@email.com" autocomplete="email">
                    <span class="form-error" id="emailError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                    <span class="btn-text">Envoyer le lien</span>
                    <span class="btn-loading" style="display: none;">
                        <span class="spinner"></span>
                        Envoi...
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="login.html">Retour a la connexion</a></p>
            </div>
        </div>

        <div class="auth-success" id="successMessage" style="display: none;">
            <div class="success-icon">📧</div>
            <h2>Email envoye !</h2>
            <p>Si un compte existe avec cet email, tu recevras un lien de reinitialisation.</p>
            <p style="margin-top: 15px; font-size: 14px; color: #666;">
                Verifie aussi tes spams.
            </p>
            <a href="login.html" class="btn btn-secondary" style="margin-top: 20px;">Retour a la connexion</a>
        </div>

        <div class="auth-error" id="errorMessage" style="display: none;">
            <div class="error-icon">❌</div>
            <h2>Erreur</h2>
            <p id="errorText">Une erreur s'est produite.</p>
            <button class="btn btn-secondary" onclick="resetForm()">Reessayer</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://peaceful-happiness-production-ef9d.up.railway.app';

        const forgotForm = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;

            showLoading(true);

            try {
                const response = await fetch(`${BACKEND_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Une erreur s\'est produite');
                    return;
                }

                showSuccess();

            } catch (error) {
                showError('Erreur reseau. Reessaie.');
            } finally {
                showLoading(false);
            }
        });

        function showLoading(show) {
            submitBtn.disabled = show;
            submitBtn.querySelector('.btn-text').style.display = show ? 'none' : 'inline';
            submitBtn.querySelector('.btn-loading').style.display = show ? 'inline-flex' : 'none';
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess() {
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            forgotForm.style.display = 'none';
            document.querySelector('.auth-footer').style.display = 'none';
        }

        function resetForm() {
            forgotForm.reset();
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            forgotForm.style.display = 'block';
            document.querySelector('.auth-footer').style.display = 'block';
        }
    </script>
</body>
</html>
